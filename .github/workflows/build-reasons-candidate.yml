name: Build Reasons Candidate Once
# Attempt 2: integration test now reads complete functions, including local const.
on:
  push:
    branches: ['ui/decision-reasons-20261021']
    paths: ['.github/workflows/build-reasons-candidate.yml']
permissions:
  contents: write
jobs:
  integrate-candidate:
    if: github.repository == 'nakayama2536-happy/India_1400' && github.ref == 'refs/heads/ui/decision-reasons-20261021' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply base-pinned UI-only patch
        run: python scripts/integrate_reasons_candidate.py
      - name: Validate all existing and new Node behavior
        run: node --test tests/*.test.cjs
      - name: Commit the candidate on the same branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ui/decision-reasons-20261021
          git diff --check
          git diff --exit-code e97b5b4d7d7144b4fc41a909a7aee200d2510053 -- '*.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION manifest.webmanifest sw.js CHANGELOG.md tests/indicator-charts.test.cjs tests/technical-charts.test.cjs .github/workflows/decision-reasons.yml
          git commit -m 'feat(ui): integrate compact reasons v5.46 after regression checks'
          git push origin HEAD:refs/heads/ui/decision-reasons-20261021
