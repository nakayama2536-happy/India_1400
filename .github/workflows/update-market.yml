name: Update India 14:00 market data

on:
  workflow_dispatch:
  schedule:
    # UTC. 04:55-05:05 UTC = 13:55-14:05 JST. 3回に抑えてAPI負荷を低減
    - cron: '55 4 * * 1-5'
    - cron: '0,5 5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: india-1400-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch market data and calculate analytics
        run: python update_market.py

      - name: Commit market and history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json history.json nifty_daily_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update India 14:00 market analytics v4.4"
            git push
          fi
