name: Legacy India market updater (manual fallback only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: india-1400-legacy-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Fetch market data and calculate analytics
        run: |
          python update_market.py
          python v48_enhance.py
          python v50_enhance.py
          python v51_enhance.py
          python v52_enhance.py
          python v53_history.py
          python v54_status.py
          python v56_forecast_eval.py
          python v57_detail_chart.py

      - name: Commit market and history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json history.json nifty_daily_history.json indicator_history.json forecast_evaluation.json nifty_ohlc_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Legacy manual India market update"
            git push
          fi
