name: Update India 14:00 market data

on:
  workflow_dispatch:
  schedule:
    # 14:00 JST check window. Avoid exact :00 to reduce scheduler congestion.
    - cron: '57 4 * * 1-5'
    - cron: '3,8 5 * * 1-5'
    # 19:47 JST = 16:17 IST, after the regular NSE close.
    # This persists today's close for the next day's confirmed technicals.
    - cron: '47 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: india-1400-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch market data and calculate analytics
        run: |
          python update_market.py
          python v48_enhance.py
          python v50_enhance.py

      - name: Commit market and history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json history.json nifty_daily_history.json indicator_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update India 14:00 market analytics v5.0"
            git push
          fi
