name: Update India 14:00 market data

on:
  workflow_dispatch:
  schedule:
    # UTC. 04:57 / 05:03 / 05:08 UTC = 13:57 / 14:03 / 14:08 JST
    - cron: '57 4 * * 1-5'
    - cron: '3,8 5 * * 1-5'
    # UTC. 10:47 UTC = 19:47 JST（インド市場引け後の日足確定用）
    - cron: '47 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: india-1400-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch market data and calculate analytics
        run: python update_market.py

      - name: Commit market and history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json history.json nifty_daily_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update India 14:00 market analytics v4.7"
            git push
          fi
