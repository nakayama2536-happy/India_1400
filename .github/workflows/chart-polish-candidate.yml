name: Build reviewed chart polish candidate
on:
  push:
    branches: ['ui/chart-polish-20261020']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'nakayama2536-happy/India_1400' && github.ref == 'refs/heads/ui/chart-polish-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify locally tested inputs and apply the base-pinned patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'technical-charts.js':'5e27edf48b5fc53e393095ab9e8942cd69bf8f19','scripts/chart_polish_patch.py':'7354422c7c509fd0c4329842b45ba333bf4cd013','tests/technical-charts.test.cjs':'701a225960b913f56dfa27c9b6f223c4864a673e'}
          for path,sha in expected.items():
              data=Path(path).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==sha, (path,actual,sha)
          PY
          python scripts/chart_polish_patch.py
          git restore .github/workflows/pr-validation.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          data=Path('index.html').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='988b72892cf786f51c6651588947131d2482981d'
          Path('/tmp/chart-inline.js').write_text('\n'.join(re.findall(r'<script>([\s\S]*?)</script>',data.decode())))
          PY
      - name: Validate candidate syntax and all JavaScript regression tests
        run: |
          node --check /tmp/chart-inline.js
          node --check technical-charts.js
          node --test tests/*.test.cjs
      - name: Commit only UI candidate files to the same feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ui/chart-polish-20261020'
          git diff --exit-code -- '*.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/chart_polish_patch.py
          git add index.html VERSION manifest.webmanifest sw.js tests/indicator-charts.test.cjs
          git commit -m 'feat(ui): integrate chart polish v5.44 after regression checks'
          git push origin HEAD:refs/heads/ui/chart-polish-20261020
