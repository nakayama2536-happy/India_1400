name: Verify India UI 5.50 Date Axis Once
on:
  push:
    branches: ['verify/u550-date-axis-20261024']
    paths: ['.github/workflows/verify-u550-date-axis-once.yml']
permissions:
  contents: read
jobs:
  browser-axis:
    if: github.repository == 'nakayama2536-happy/India_1400' && github.ref == 'refs/heads/verify/u550-date-axis-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned source and run axis contract
        run: |
          git merge-base --is-ancestor 9b0fe62538c87bcff6141b8f3af2487a5a5d4aa0 HEAD
          test "$(git diff --name-only 9b0fe62538c87bcff6141b8f3af2487a5a5d4aa0 HEAD)" = ".github/workflows/verify-u550-date-axis-once.yml"
          node --check technical-charts.js
          node --test tests/chart-date-axis.test.cjs tests/chart-zoom-mobile.test.cjs
      - name: Create a local DOM fixture with real saved NIFTY trading sessions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path("market.json").read_text(encoding="utf-8"))
          rows=m["chart_data"]["nifty"]["price"]
          assert len(rows)==30 and rows[-1]["date"]=="2026-10-23"
          template=r'''<!doctype html><html lang="ja"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          :root{--line:#263854;--muted:#9eb0c8;--text:#f4f7fb;--accent:#70a9ff;
            --c-nifty:#70a9ff;--c-ma5:#f4c14b;--c-ma25:#29c777;--c-ma75:#ff7272;--c-rsi:#59d8ff}
          *{box-sizing:border-box}body{background:#07111f;margin:0;color:white;font:14px sans-serif}
          .chart{display:block;width:100%;height:auto}
          .chart .line-main{stroke:#70a9ff;stroke-width:2.4;fill:none}
          .chart .gridline{stroke:#32445e}.chart text{font-size:11px;fill:#a5b4ca}
          </style><link rel="stylesheet" href="/chart-experience.css"></head>
          <body><button type="button" data-ix-expand="niftyChart" id="open">拡大</button>
          <div id="niftyChart" style="width:100%;max-width:355px"></div><pre id="result">pending</pre>
          <script src="/technical-charts.js"></script><script src="/chart-experience.js"></script>
          <script>
          const rows=__OBSERVED_ROWS__;
          const series=[{key:'close',cls:'line-main'}];
          const basis={kind:'nifty',width:Math.min(innerWidth-24,355)};
          const source=IndiaTechnicalCharts.lineChart(rows,series,[],basis);
          document.querySelector('#niftyChart').innerHTML=source;
          const sourceCount=[...document.querySelectorAll('#niftyChart svg text')].filter(x=>/^\d{2}\/\d{2}$/.test(x.textContent)).length;
          const app=IndiaChartExperience.createController(window,{
            renderExpandedChart:(id,w,h)=>IndiaTechnicalCharts.lineChart(rows,series,[],{kind:'nifty',width:w,height:h})
          });
          app.bind();
          setTimeout(()=>{
            document.getElementById('open').click();
            const modal=document.querySelector('#ixChartOverlay');
            const body=modal.querySelector('.ix-modal-body');
            const panel=modal.querySelector('.ix-modal-panel');
            const close=modal.querySelector('.ix-close');
            const svgBefore=modal.querySelector('.ix-modal-content svg');
            const heightBefore=svgBefore.getBoundingClientRect().height;
            for(let i=0;i<6;i++)modal.querySelector('[data-ix-zoom="1"]').click();
            const svg=modal.querySelector('.ix-modal-content svg');
            const bodyRect=body.getBoundingClientRect();
            const labels=[...svg.querySelectorAll('text')].filter(t=>/^\d{2}\/\d{2}$/.test(t.textContent.trim()));
            const marks=labels.map(t=>({date:t.textContent.trim(),x:t.getBoundingClientRect().x,
              width:t.getBoundingClientRect().width,right:t.getBoundingClientRect().right}));
            const visible=marks.filter(t=>t.right>bodyRect.left&&t.x<bodyRect.right);
            const sortedDates=marks.map(x=>x.date);
            const collisions=marks.some((m,i)=>i>0&&m.x<marks[i-1].right-1);
            const p={viewport:{width:innerWidth,height:innerHeight},
              normalDates:sourceCount,allDates:sortedDates,visibleDates:visible.map(x=>x.date),
              labelCount:labels.length,visibleCount:visible.length,collisions,plotHeight:svg.getBoundingClientRect().height,
              beforeHeight:heightBefore,
              scrollMax:body.scrollWidth-body.clientWidth,
              headerRight:panel.querySelector('.ix-modal-head').getBoundingClientRect().right,
              closeRight:close.getBoundingClientRect().right,
              passed:sourceCount===3&&visible.length>=3&&sortedDates.at(-1)==='10/23'&&
                visible.some(x=>x.date!=='10/23')&&!collisions&&
                Math.abs(svg.getBoundingClientRect().height-heightBefore)<2&&
                body.scrollWidth>body.clientWidth&&
                close.getBoundingClientRect().right<=innerWidth+2&&
                modal.querySelector('.ix-zoom-label').textContent==='250%'};
            document.getElementById('result').textContent=JSON.stringify(p);
          },150);
          </script></body></html>'''
          Path('.axis-fixture.html').write_text(template.replace('__OBSERVED_ROWS__',
            json.dumps(rows,ensure_ascii=False,separators=(",",":"))),encoding="utf-8")
          PY
      - name: Check 320/375/393/430 portrait CSS widths in real Chromium
        run: |
          python3 -m http.server 9888 --bind 127.0.0.1 >/tmp/axis-http.txt 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          node <<'JS'
          const {spawn}=require('node:child_process');
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const pause=ms=>new Promise(done=>setTimeout(done,ms));
          const chrome=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':fs.existsSync('/usr/bin/chromium')?'/usr/bin/chromium':'google-chrome';
          const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'india-dates-ui550-'));
          const proc=spawn(chrome,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu',
            '--remote-debugging-port=9226','--remote-allow-origins=*','--user-data-dir='+tmp,'about:blank'],{stdio:'ignore'});
          async function go(){
            let ok=false;
            for(let i=0;i<60;i++){
              try{await(await fetch('http://127.0.0.1:9226/json/version')).json();ok=true;break}
              catch(_){await pause(100);}
            }
            if(!ok)throw Error('CHROME_DEBUG_UNAVAILABLE');
            const target=await(await fetch('http://127.0.0.1:9226/json/new?about:blank',{method:'PUT'})).json();
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
            const pending=new Map();let seq=0;
            ws.addEventListener('message',e=>{
              const r=JSON.parse(e.data);
              if(r.id&&pending.has(r.id)){
                const p=pending.get(r.id);pending.delete(r.id);
                r.error?p.reject(Error(JSON.stringify(r.error))):p.resolve(r.result);
              }
            });
            const command=(method,params={})=>new Promise((resolve,reject)=>{
              const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));
            });
            try{
              await command('Page.enable');
              for(const [width,height,dpr] of [[320,700,2],[375,812,3],[393,852,3],[430,932,3]]){
                await command('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:dpr,mobile:true,screenWidth:width,screenHeight:height});
                await command('Page.navigate',{url:'http://127.0.0.1:9888/.axis-fixture.html'});
                await pause(250);
                const script="new Promise(resolve=>{let n=0;const timer=setInterval(()=>{const s=document.getElementById('result')?.textContent;if(s?.startsWith('{')||++n>100){clearInterval(timer);resolve(s||'NOT_READY');}},50);})";
                const response=await command('Runtime.evaluate',{expression:script,awaitPromise:true,returnByValue:true});
                const data=JSON.parse(response.result.value);
                console.log('DATE_AXIS_VIEWPORT '+JSON.stringify(data));
                if(data.viewport.width!==width||data.viewport.height!==height||!data.passed)
                  throw Error('DATE_AXIS_BROWSER_FAIL '+width+' '+JSON.stringify(data));
              }
              console.log('DATE_AXIS_BROWSER_PASS four emulated mobile widths 320/375/393/430, actual saved NIFTY dates. Not iPhone Safari acceptance.');
            }finally{ws.close()}
          }
          go().catch(e=>{console.error('DATE_AXIS_BROWSER_ERROR',e);process.exitCode=1}).finally(()=>proc.kill('SIGTERM'));
          JS
