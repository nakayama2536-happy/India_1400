name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Python syntax check
        run: |
          python -m py_compile update_market.py v48_enhance.py v49_enhance.py v50_enhance.py v51_enhance.py

      - name: JSON and PWA version validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = {}
          for line in Path("VERSION").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  version[k.strip()] = v.strip()

          appv = version["APP_VERSION"]
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          market = json.loads(Path("market.json").read_text(encoding="utf-8"))
          json.loads(Path("history.json").read_text(encoding="utf-8"))
          json.loads(Path("indicator_history.json").read_text(encoding="utf-8"))
          json.loads(Path("nifty_daily_history.json").read_text(encoding="utf-8"))

          index = Path("index.html").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")

          assert market.get("app_version") == appv, "market.json app_version mismatch"
          assert f"v={appv}" in manifest.get("start_url", ""), "manifest version mismatch"
          assert f"v{appv}" in index, "index version mismatch"
          assert f"v{appv.replace('.', '-')}" in sw, "service worker cache version mismatch"

          required = [
              "index.html", "manifest.webmanifest", "sw.js", "market.json",
              "update_market.py", ".github/workflows/update-market.yml",
              ".github/workflows/security-check.yml"
          ]
          missing = [p for p in required if not Path(p).exists()]
          assert not missing, f"missing required files: {missing}"

          print(f"VALIDATION PASS: India 14:00 Check v{appv}")
          PY
