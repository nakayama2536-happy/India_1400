name: PR Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate public PWA and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = {}
          for line in Path("VERSION").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  version[k.strip()] = v.strip()

          appv = version["APP_VERSION"]
          uiv = version["UI_VERSION"]
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          market = json.loads(Path("market.json").read_text(encoding="utf-8"))
          for name in (
              "history.json",
              "indicator_history.json",
              "forecast_evaluation.json",
              "nifty_daily_history.json",
              "nifty_ohlc_history.json",
              "india_core_history.json",
          ):
              json.loads(Path(name).read_text(encoding="utf-8"))

          index = Path("index.html").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")

          assert market.get("app_version") == appv, "market.json app_version mismatch"
          assert f"v={uiv}" in manifest.get("start_url", ""), "manifest UI version mismatch"
          assert f"v{uiv}" in index, "index UI version mismatch"
          assert f"v{uiv.replace('.', '-')}" in sw, "service worker UI cache version mismatch"

          required = [
              "index.html", "manifest.webmanifest", "sw.js", "market.json",
              "history.json", "indicator_history.json", "forecast_evaluation.json",
              "nifty_daily_history.json", "nifty_ohlc_history.json", "india_core_history.json",
              ".github/workflows/security-check.yml",
          ]
          missing = [p for p in required if not Path(p).exists()]
          assert not missing, f"missing required public files: {missing}"

          forbidden_private_code = [
              "update_market.py", "v48_enhance.py", "v49_enhance.py",
              "v50_enhance.py", "v51_enhance.py", "v52_enhance.py",
              "v53_history.py", "v54_status.py", "v56_forecast_eval.py",
              "v57_detail_chart.py", ".github/workflows/update-market.yml",
          ]
          exposed = [p for p in forbidden_private_code if Path(p).exists()]
          assert not exposed, f"private calculation/update files exposed publicly: {exposed}"

          common_ui_markers = [
              'id="commonDigestCard"',
              'id="commonPhase"',
              'id="commonEligibility"',
              'id="commonDataState"',
              'id="commonQcState"',
              'fetchJson("common_snapshot.json").catch(()=>null)',
              'function renderCommonDigest()',
          ]
          missing_common = [x for x in common_ui_markers if x not in index]
          assert not missing_common, f"missing Common Schema fallback UI markers: {missing_common}"

          expected_private_workflow = (
              "https://github.com/nakayama2536-happy/"
              "india-stock-check/actions/workflows/update-market.yml"
          )
          obsolete_public_workflow = (
              "https://github.com/nakayama2536-happy/"
              "India_1400/actions/workflows/update-market.yml"
          )
          assert expected_private_workflow in index, "PWA update target is not the approved Private workflow"
          assert obsolete_public_workflow not in index, "obsolete Public market workflow target remains in PWA"
          assert "POLL_MAX_ATTEMPTS=48" in index, "update polling must cover the measured publication latency"
          assert "h.current_date_has_record" in index, "14:00 status must use actual snapshot evidence"
          assert "DYNAMIC_JSON" in sw and "canonicalKey" in sw, "dynamic JSON cache must use bounded canonical keys"

          print(f"VALIDATION PASS: India data v{appv} / UI v{uiv}")
          PY

      - name: Check India Core updater syntax
        run: python -m py_compile update_india_core.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          inline = "\n".join(x for x in scripts if x.strip())
          Path(".inline-app.js").write_text(inline, encoding="utf-8")
          PY
          node --check .inline-app.js
