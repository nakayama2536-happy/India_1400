name: PR Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate public PWA and JSON
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = {}
          for line in Path("VERSION").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  version[k.strip()] = v.strip()

          appv = version["APP_VERSION"]
          uiv = version["UI_VERSION"]
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          market = json.loads(Path("market.json").read_text(encoding="utf-8"))
          for name in (
              "history.json",
              "indicator_history.json",
              "forecast_evaluation.json",
              "nifty_daily_history.json",
              "nifty_ohlc_history.json",
              "india_core_history.json",
          ):
              json.loads(Path(name).read_text(encoding="utf-8"))

          index = Path("index.html").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          deep = Path("deep-dive.js").read_text(encoding="utf-8")
          bundle = Path("deep-dive-bundle.js").read_text(encoding="utf-8")
          publication = json.loads(Path("publication_manifest.json").read_text(encoding="utf-8"))

          assert market.get("app_version") == appv, "market.json app_version mismatch"
          assert f"v={uiv}" in manifest.get("start_url", ""), "manifest UI version mismatch"
          assert f"v{uiv}" in index, "index UI version mismatch"
          assert f"v{uiv.replace('.', '-')}" in sw, "service worker UI cache version mismatch"

          required = [
              "index.html", "deep-dive.js", "deep-dive-bundle.js", "review-history.js", "publication_manifest.json", "manifest.webmanifest", "sw.js", "market.json",
              "history.json", "indicator_history.json", "forecast_evaluation.json",
              "nifty_daily_history.json", "nifty_ohlc_history.json", "india_core_history.json",
              ".github/workflows/security-check.yml",
          ]
          missing = [p for p in required if not Path(p).exists()]
          assert not missing, f"missing required public files: {missing}"

          forbidden_private_code = [
              "update_market.py", "v48_enhance.py", "v49_enhance.py",
              "v50_enhance.py", "v51_enhance.py", "v52_enhance.py",
              "v53_history.py", "v54_status.py", "v56_forecast_eval.py",
              "v57_detail_chart.py", ".github/workflows/update-market.yml",
          ]
          exposed = [p for p in forbidden_private_code if Path(p).exists()]
          assert not exposed, f"private calculation/update files exposed publicly: {exposed}"

          common_ui_markers = [
              'id="qualityTopSummary"',
              'id="globalReferenceTimes"',
              'id="page-quality"',
              'data-page="quality"',
              'fetchJson("common_snapshot.json").catch(()=>null)',
              'function renderQualityOverview()',
              'function fundBasisHealth(',
              'function referenceHealth(',
              'function forecastArrow(',
          ]
          missing_common = [x for x in common_ui_markers if x not in index]
          assert not missing_common, f"missing Common Schema fallback UI markers: {missing_common}"

          deep_ui_markers = [
              'id="deepDiveBuildBtn"',
              'id="deepDiveShareBtn"',
              'id="deepDiveSaveBtn"',
              'id="deepDiveCopyBtn"',
              'id="deepDiveTriggerCard"',
              'id="deepDiveTriggerLevel"',
              'id="deepDiveTriggerOpenBtn"',
              '<script src="deep-dive-bundle.js"></script>',
              '<script src="deep-dive.js"></script>',
          ]
          missing_deep_ui = [x for x in deep_ui_markers if x not in index]
          assert not missing_deep_ui, f"missing deep-dive UI markers: {missing_deep_ui}"

          deep_code_markers = [
              "const DEEP_DIVE_FILES",
              "function buildDeepDiveMarkdown",
              "function buildDeepDiveArtifact",
              "navigator.canShare",
              'scope:"tranche_status_and_dates"',
              'const DEEP_DIVE_PRIVACY_VERSION="0.1"',
              "function readDeepDivePurchaseProgress",
              "function deepDiveExportTrigger",
              "function invalidateDeepDivePrivacy",
              "choice.checked=false",
              "window.confirm",
              "function evaluateDeepDiveTriggers",
              "trigger_context:trigger",
              "mandatory_checks",
          ]
          missing_deep_code = [x for x in deep_code_markers if x not in deep]
          assert not missing_deep_code, f"missing deep-dive implementation markers: {missing_deep_code}"
          assert version.get("DEEP_DIVE_PRIVACY_VERSION") == "0.1", "privacy component version mismatch"
          assert Path("tests/deep-dive-privacy.test.cjs").exists(), "privacy behavior tests missing"
          privacy_ci = Path(".github/workflows/deep-dive-manifest.yml").read_text(encoding="utf-8")
          assert "node --test tests/deep-dive-manifest.test.cjs tests/deep-dive-privacy.test.cjs" in privacy_ci, "privacy behavior tests must execute in CI"

          dynamic_match = re.search(r"const DYNAMIC_JSON\s*=\s*new Set\(\[(.*?)\]\);", sw, flags=re.S)
          assert dynamic_match, "service worker DYNAMIC_JSON declaration not found"
          dynamic_json = set(re.findall(r'"([^"]+\.json)"', dynamic_match.group(1)))
          deep_json = set(re.findall(r'path:"([^"]+\.json)"', deep))
          missing_from_deep = sorted((dynamic_json - {"publication_manifest.json"}) - deep_json)
          assert not missing_from_deep, (
              "deep-dive export is missing app analytical JSON files: "
              + ", ".join(missing_from_deep)
          )
          assert "VERSION" in deep and "VERSION" in sw, "deep-dive VERSION snapshot/cache marker missing"
          assert "publication_manifest.json" in dynamic_json, "publication manifest must be network-first"
          assert 'const DYNAMIC_TEXT = new Set(["VERSION"])' in sw, "VERSION must use bounded network-first cache"
          assert "IndiaDeepDiveBundle" in bundle, "deep-dive bundle verifier missing"
          assert "loadVerifiedSources" in deep, "deep-dive builder is not using verified sources"
          assert publication.get("market") == "INDIA", "publication manifest market mismatch"
          assert publication.get("source_state") == "READY", "publication manifest is not READY"
          required_manifest_paths = {x.get("path") for x in publication.get("files",[]) if x.get("required_for_bundle")}
          expected_bundle_paths = {
              "market.json","history.json","indicator_history.json","forecast_evaluation.json",
              "nifty_daily_history.json","nifty_ohlc_history.json","common_snapshot.json",
              "india_core.json","india_core_history.json","VERSION",
          }
          assert required_manifest_paths == expected_bundle_paths, "publication manifest source set mismatch"
          assert all(len(str(x.get("sha256") or "")) == 64 for x in publication.get("files",[])), "publication manifest hash missing"
          assert Path("tests/deep-dive-manifest.test.cjs").exists(), "deep-dive manifest tests missing"
          assert '<script src="review-history.js"></script>' in index, "review history module script missing"
          assert 'id="deepDiveReviewPanel"' in index, "review panel missing"
          assert 'IndiaReviewHistory' in index, "review history runtime hooks missing"
          assert 'バックアップJSONを保存' in index and 'バックアップを復元' in index
          assert Path("review-history.js").exists(), "review history module missing"
          assert Path("tests/review-history.test.cjs").exists(), "review history tests missing"

          expected_private_workflow = (
              "https://github.com/nakayama2536-happy/"
              "india-stock-check/actions/workflows/update-market.yml"
          )
          obsolete_public_workflow = (
              "https://github.com/nakayama2536-happy/"
              "India_1400/actions/workflows/update-market.yml"
          )
          assert expected_private_workflow in index, "PWA update target is not the approved Private workflow"
          assert obsolete_public_workflow not in index, "obsolete Public market workflow target remains in PWA"
          assert "POLL_MAX_ATTEMPTS=48" in index, "update polling must cover the measured publication latency"
          assert "h.current_date_has_record" in index, "14:00 status must use actual snapshot evidence"
          assert "market?.acquisition_status" in index, "14:00 UI must prefer explicit acquisition status when available"
          assert "acquisition_status:m.acquisition_status" in deep, "deep-dive summary must include acquisition status"
          assert index.count('id="forecastCards"') == 1, "forecastCards must be unique"
          assert index.index('id="actionLabel"') < index.index('id="forecastCards"') < index.index('id="marketStage"'), "business-day forecast must be directly under the decision"
          assert "<h2>1・3・14営業日予測</h2>" not in index, "standalone forecast card must be removed after moving forecast under decision"
          assert 'id="commonDigestCard"' not in index and "10秒ダイジェスト" not in index, "redundant digest must stay removed"
          assert index.count('id="globalReferenceTimes"') == 1, "shared reference time strip must be unique"
          assert index.index('id="globalReferenceTimes"') < index.index('id="page-decision"'), "reference time strip must be common to all tabs"
          assert 'id="decisionDataTimes"' not in index, "decision-only reference time card must stay removed"
          assert index.index('id="page-quality"') < index.index('id="qualityTopSummary"') < index.index('id="page-detail"'), "quality summary must live inside the dedicated quality tab"
          global_status = index[index.index('class="card global-status-card"'):index.index('id="page-decision"')]
          assert "データ品質" not in global_status and 'id="qualityTopSummary"' not in global_status, "data quality must not remain in the global strip"
          assert 'basis-${basisHealth.ok?"good":"bad"}' not in index, "legacy India Core single-field coloring should be replaced by seven status tiles"
          for label in ("基準日","純資産総額","MA25","MA75","RSI14","MACD","25/75日線"):
              assert f'statusTileHtml("{label}"' in index, f"India Core status tile missing: {label}"
          assert 'class="status-tile-grid fund-status-grid"' in index, "India Core seven-tile grid missing"
          assert 'class="deep-trigger-cats status-tile-grid"' in index, "GPT four-category color grid missing"
          assert 'status=!x.active?"OFF / 正常":x.severity>=2?"優先":"推奨"' in index, "GPT trigger green/yellow/red mapping missing"
          assert 'class="status-tile-grid yen-status-grid"' in index, "yen status tile grid missing"
          assert all(x in index for x in ("円換算 追い風","円換算 逆風","円換算 中立")), "yen contribution color semantics missing"
          assert all(x in index for x in ("↑↑","↑","→","↓","↓↓")), "five-level forecast arrow vocabulary missing"
          assert 'h2,.card-title{font-size:20px' in index, "card title hierarchy contract missing"
          assert "ref-compact-grid" in index and "ref-compact-item" in index, "compact reference time UI missing"
          assert "status-tile-grid" in index and "status-tile.good" in index and "status-tile.bad" in index, "shared colored tile graphic missing"
          assert "DYNAMIC_JSON" in sw and "canonicalKey" in sw, "dynamic JSON cache must use bounded canonical keys"

          print(f"VALIDATION PASS: India data v{appv} / UI v{uiv}")
          PY

      - name: Public delivery safety gate
        run: |
          python scripts/public_delivery_gate.py
          python -m unittest tests.test_public_delivery_gate

      - name: Check India Core updater syntax
        run: python -m py_compile update_india_core.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          inline = "\n".join(x for x in scripts if x.strip())
          Path(".inline-app.js").write_text(inline, encoding="utf-8")
          PY
          node --check .inline-app.js
          node --check deep-dive.js
          node --check deep-dive-bundle.js
          node --check review-history.js