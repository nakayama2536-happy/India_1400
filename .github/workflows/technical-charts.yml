name: Technical Chart Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  technical-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate display-only renderer and integration contracts
        run: |
          node --check technical-charts.js
          node --test tests/indicator-charts.test.cjs tests/technical-charts.test.cjs
