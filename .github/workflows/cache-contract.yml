name: Cache Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute worker cache contract tests
        run: node --test tests/sw-cache.test.cjs
