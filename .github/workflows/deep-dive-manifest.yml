name: Deep Dive Manifest Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'deep-dive-bundle.js'
      - 'deep-dive.js'
      - 'tests/deep-dive-manifest.test.cjs'
      - 'tests/deep-dive-privacy.test.cjs'
      - '.github/workflows/deep-dive-manifest.yml'
      - 'index.html'
      - 'VERSION'
      - 'manifest.webmanifest'
      - 'sw.js'
  push:
    branches: [main]
    paths:
      - 'deep-dive-bundle.js'
      - 'deep-dive.js'
      - 'tests/deep-dive-manifest.test.cjs'
      - 'tests/deep-dive-privacy.test.cjs'
      - '.github/workflows/deep-dive-manifest.yml'
      - 'index.html'
      - 'VERSION'
      - 'manifest.webmanifest'
      - 'sw.js'

permissions:
  contents: read

jobs:
  deep-dive-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check deep-dive-bundle.js
          node --check deep-dive.js
      - name: Execute FULL manifest and privacy contracts
        run: node --test tests/deep-dive-manifest.test.cjs tests/deep-dive-privacy.test.cjs
