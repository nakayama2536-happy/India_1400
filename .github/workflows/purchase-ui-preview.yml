name: Purchase UI Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'VERSION'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'tests/purchase-compact.test.cjs'
      - '.github/workflows/purchase-ui-preview.yml'

permissions:
  contents: read

jobs:
  purchase-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Extract and check production inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",html,re.S|re.I)
          Path(".inline-purchase.js").write_text("\n".join(s for s in scripts if s.strip()),encoding="utf-8")
          PY
          node --check .inline-purchase.js
      - name: Execute production purchase-state behavior tests
        env:
          PURCHASE_PREVIEW_HTML: index.html
        run: node --test tests/purchase-compact.test.cjs
