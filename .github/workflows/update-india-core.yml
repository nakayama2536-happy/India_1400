name: Update India Core fund NAV

on:
  workflow_dispatch:
  schedule:
    # App-only migration: check several times in the evening so the PWA can
    # replace the recurring narrative report without guessing publication time.
    - cron: '15 10 * * 1-5'  # 19:15 JST
    - cron: '15 11 * * 1-5'  # 20:15 JST retry
    - cron: '20 13 * * 1-5'  # 22:20 JST retry
    - cron: '45 14 * * 1-5'  # 23:45 JST safety retry

permissions:
  contents: write

concurrency:
  group: india-core-nav-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Record actual acquisition start
        env:
          ACQUISITION_EVENT: ${{ github.event_name }}
          ACQUISITION_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          evidence = {
              "event": os.environ.get("ACQUISITION_EVENT"),
              "schedule_expression": os.environ.get("ACQUISITION_CRON"),
              "worker_step_started_at": datetime.now(timezone.utc).isoformat(),
              "nominal_occurrence": "not supplied by schedule context; do not infer as fact"
          }
          print(json.dumps(evidence))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Fund acquisition timing\n```json\n" + json.dumps(evidence, indent=2) + "\n```\n")
          PY

      - name: Update India Core latest NAV
        run: python update_india_core.py

      - name: Check India Core update status
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.load(open("india_core.json", encoding="utf-8"))
          status = data.get("status")
          as_of = data.get("as_of_date")
          tech = data.get("technical") or {}
          report = {
              "nav_status": status,
              "nav_date": as_of,
              "official_status": data.get("official_status"),
              "history_status": data.get("history_status"),
              "history_count": tech.get("history_count"),
              "technical_ready": tech.get("available") is True
          }
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## NAV and history are separate outcomes\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
          if status == "ok":
              print(f"India Core NAV fetched: {as_of}; this alone is not full technical acceptance.")
              if not tech.get("available"):
                  print("::warning::Fund NAV is available, but technical history is incomplete or inconsistent.")
          elif status == "fallback":
              print(f"::warning::India Core NAV uses a saved reference ({as_of or 'unknown date'}).")
          else:
              print("::error::India Core NAV is unavailable.")
              sys.exit(1)
          PY

      - name: Commit fund data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add india_core.json india_core_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update India Core fund NAV"
            git push
          fi
