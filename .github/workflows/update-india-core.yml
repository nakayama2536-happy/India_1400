name: Update India Core fund NAV

on:
  workflow_dispatch:
  schedule:
    # 22:20 JST on weekdays. Fund NAV is generally available by evening.
    - cron: '20 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: india-core-nav-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Update India Core latest NAV
        run: python update_india_core.py

      - name: Commit fund data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add india_core.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update India Core fund NAV"
            git push
          fi
